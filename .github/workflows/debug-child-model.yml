name: Debug child model hosted runtime
on:
  push:
    branches: [child-voice-studio-v01]
    paths:
      - "child_model_lab/runtime_logs.py"
      - ".github/workflows/debug-child-model.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "huggingface_hub==0.36.0"
      - name: Read child-model Space runtime logs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python child_model_lab/runtime_logs.py
