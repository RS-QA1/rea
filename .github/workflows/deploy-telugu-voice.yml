name: Deploy Telugu Voice Studio to Hugging Face
on:
  push:
    branches: [child-voice-studio-v01]
    paths:
      - "child_voice_studio/**"
      - ".github/workflows/deploy-telugu-voice.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Hugging Face secret
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Add a HF_TOKEN repository secret in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hugging Face Hub client
        run: python -m pip install "huggingface_hub>=0.29,<2"
      - name: Compile app and check syntax
        run: python -m py_compile child_voice_studio/app.py child_voice_studio/deploy_to_hf.py
      - name: Deploy Gradio Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python child_voice_studio/deploy_to_hf.py | tee /tmp/hf-deploy.txt
      - name: Publish app URL back to GitHub
        run: |
          DEPLOYED_URL="$(sed -n 's/^DEPLOYED_SPACE=//p' /tmp/hf-deploy.txt | tail -1)"
          if [ -z "$DEPLOYED_URL" ]; then
            echo "::error::Deployment did not report a Space URL."
            exit 1
          fi
          printf '# Telugu Voice Studio deployed Space\n\n%s\n\nThis URL reports the published Space, not independently verified audio playback.\n' "$DEPLOYED_URL" > DEPLOYED_TELUGU_APP.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYED_TELUGU_APP.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record Hugging Face Telugu Voice Studio URL'
            git push origin HEAD:child-voice-studio-v01
          fi
