name: Deploy Telugu Voice Studio to Hugging Face
on:
  push:
    branches: [child-voice-studio-v01]
    paths:
      - "child_voice_studio/**"
      - ".github/workflows/deploy-telugu-voice.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Hugging Face secret
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Add a HF_TOKEN repository secret in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hugging Face Hub client
        run: python -m pip install "huggingface_hub>=0.29,<2"
      - name: Deploy Gradio Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python child_voice_studio/deploy_to_hf.py
