name: Diagnose hosted Telugu F5 audio processing
on:
  push:
    branches: [child-voice-studio-v01]
    paths:
      - "reference_telugu_f5/runtime_logs.py"
      - ".github/workflows/diagnose-hosted-telugu-f5.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "huggingface_hub==0.36.0" requests
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python reference_telugu_f5/runtime_logs.py
