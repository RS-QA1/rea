name: Compare Telugu child voice samples
on:
  push:
    branches: [child-voice-studio-v01]
    paths: [.github/workflows/compare-telugu-child-voices.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t telugu-child-voice telugu_child_voice
      - name: Render Telugu dialogue using synthetic child characters
        run: |
          mkdir candidates
          docker run --rm -i --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/candidates:/samples" telugu-child-voice python - <<'PY'
          import random
          import numpy as np
          import soundfile as sf
          import torch
          from app import load_model

          model = load_model()
          seed_text = "Mom, come and see! There's a tiny dragon in our garden. I think it wants to play with us!"
          dialogue = "అమ్మా! ఇటు చూడు! మన తోటలో ఓ చిన్న డ్రాగన్ ఉంది!"
          for name, instruction, seed in (
              ("girl", "female, child, high pitch", 105),
              ("boy", "male, child", 203),
          ):
              random.seed(seed)
              np.random.seed(seed)
              torch.manual_seed(seed)
              voice = model.generate(text=seed_text, language="en", instruct=instruction)[0]
              sf.write(f"/samples/{name}-voice.wav", voice, 24000)
              prompt = model.create_voice_clone_prompt(ref_audio=f"/samples/{name}-voice.wav", ref_text=seed_text)
              for suffix, line in (
                  ("telugu", dialogue),
                  ("telugu-playful", "అమ్మా! ఇటు చూడు! [laughter] మన తోటలో ఓ చిన్న డ్రాగన్ ఉంది!"),
              ):
                  samples = model.generate(text=line, language="te", voice_clone_prompt=prompt)[0]
                  assert len(samples) >= 12000 and np.isfinite(samples).all() and np.max(np.abs(samples)) > 0.001
                  sf.write(f"/samples/{name}-{suffix}.wav", samples, 24000)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: telugu-child-voice-candidates
          path: candidates/*.wav
