name: Clean Telugu Voice v2 Deploy
on:
  push:
    branches: [child-voice-studio-v01]
    paths:
      - "telugu_voice_v2/**"
      - ".github/workflows/deploy-telugu-v2.yml"
  workflow_dispatch:
concurrency:
  group: telugu-v2-space-deployment
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static Python validation
        run: python -m py_compile telugu_voice_v2/app.py telugu_voice_v2/deploy.py
      - name: Build Docker container and check imports
        run: |
          docker build --pull --progress=plain -t telugu-voice-v2 telugu_voice_v2
          docker run --rm telugu-voice-v2 python -c 'import gradio,numpy,onnxruntime,huggingface_hub; print("IMPORT_TEST_PASS")'
      - name: Generate actual audio from Telugu and child-trained engines
        run: |
          docker run --rm -i telugu-voice-v2 python - <<'PY'
          import app, pathlib, subprocess
          cases = (
              ("Indic Tiny · Female", "అమ్మా! నమస్కారం!"),
              ("Piper · Padmavathi", "అమ్మా! నమస్కారం!"),
              ("Child-trained XTTS · English (beta)", "Mom! Look at the dragon!"),
          )
          for voice, dialogue in cases:
              audio, downloadable, details = app.make_audio(
                  dialogue, voice, "Natural voice", "Natural", 1.0, None, ""
              )
              result = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries", "format=duration",
                   "-of", "default=noprint_wrappers=1:nokey=1", audio],
                  capture_output=True, text=True, check=True,
              )
              duration = float(result.stdout.strip())
              assert duration > 0.5
              assert pathlib.Path(audio).stat().st_size > 2048
              print("AUDIO_SMOKE_PASS", voice, round(duration,2), flush=True)
          PY
      - name: Install only deployment tool
        run: python -m pip install 'huggingface_hub==0.36.0'
      - name: Upload to new Docker Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python telugu_voice_v2/deploy.py | tee /tmp/telugu-v2-upload.txt
      - name: Verify Space boots (not inference)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi
          import os, time
          api=HfApi(token=os.environ["HF_TOKEN"])
          url=open("/tmp/telugu-v2-upload.txt").read().split("SPACE_URL=")[1].splitlines()[0].strip()
          space=url.split("/spaces/")[1]
          stage="UNKNOWN"
          for _ in range(80):
              stage=str(api.get_space_runtime(space).stage)
              if stage in ("RUNNING","SLEEPING","BUILD_ERROR","RUNTIME_ERROR","CONFIG_ERROR","PAUSED"):
                  break
              time.sleep(6)
          print("SPACE_STAGE="+str(stage))
          with open("/tmp/telugu-v2-stage.txt","w") as f:f.write(str(stage))
          if stage not in ("RUNNING","SLEEPING"):
              raise SystemExit("Space is not running: "+str(stage))
          PY
      - name: Report verified deployment URL
        run: |
          URL="$(sed -n 's/^SPACE_URL=//p' /tmp/telugu-v2-upload.txt | tail -1)"
          STAGE="$(cat /tmp/telugu-v2-stage.txt)"
          test -n "$URL"
          test "$STAGE" = "RUNNING" -o "$STAGE" = "SLEEPING"
          {
            echo "## Telugu Voice Studio deployment"
            echo ""
            echo "- App: $URL"
            echo "- Runtime: $STAGE"
            echo "- Docker dependency/import checks: passed"
            echo "- Indic Tiny, Piper and hosted child XTTS audio tests: passed"
            echo "- Voice quality: not independently evaluated"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Verified Space: $URL ($STAGE)"
