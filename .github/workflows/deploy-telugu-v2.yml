name: Clean Telugu Voice v2 Deploy
on:
  push:
    branches: [child-voice-studio-v01]
    paths:
      - "telugu_voice_v2/**"
      - ".github/workflows/deploy-telugu-v2.yml"
  workflow_dispatch:
concurrency:
  group: telugu-v2-space-deployment
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static Python validation
        run: python -m py_compile telugu_voice_v2/app.py telugu_voice_v2/deploy.py
      - name: Build Docker container and check imports
        run: |
          docker build --pull --progress=plain -t telugu-voice-v2 telugu_voice_v2
          docker run --rm telugu-voice-v2 python -c 'import gradio,numpy,onnxruntime,huggingface_hub; print("IMPORT_TEST_PASS")'
      - name: Generate sample Telugu WAV inside Docker (required)
        run: |
          docker run --rm telugu-voice-v2 python -c 'import app, pathlib, wave; wav, _, details = app.synthesize("అమ్మా! నమస్కారం!", "Telugu female", "Natural", 1.0); f=pathlib.Path(wav); assert f.exists() and f.stat().st_size > 2048, "Empty WAV"; r=wave.open(wav,"rb"); assert r.getnframes() > r.getframerate()//2; print("SYNTHESIS_SMOKE_PASS", r.getnframes(), details)'

      - name: Install only deployment tool
        run: python -m pip install 'huggingface_hub==0.36.0'
      - name: Upload to new Docker Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python telugu_voice_v2/deploy.py | tee /tmp/telugu-v2-upload.txt
      - name: Verify Space boots (not inference)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi
          import os, time
          api=HfApi(token=os.environ["HF_TOKEN"])
          url=open("/tmp/telugu-v2-upload.txt").read().split("SPACE_URL=")[1].splitlines()[0].strip()
          space=url.split("/spaces/")[1]
          stage="UNKNOWN"
          for _ in range(80):
              stage=str(api.get_space_runtime(space).stage)
              if stage in ("RUNNING","SLEEPING","BUILD_ERROR","RUNTIME_ERROR","CONFIG_ERROR","PAUSED"):
                  break
              time.sleep(6)
          print("SPACE_STAGE="+str(stage))
          with open("/tmp/telugu-v2-stage.txt","w") as f:f.write(str(stage))
          if stage not in ("RUNNING","SLEEPING"):
              raise SystemExit("Space is not running: "+str(stage))
          PY
      - name: Record verified URL
        run: |
          URL="$(sed -n 's/^SPACE_URL=//p' /tmp/telugu-v2-upload.txt | tail -1)"
          STAGE="$(cat /tmp/telugu-v2-stage.txt)"
          printf 'Space URL: %s\nSpace boot stage: %s\nSpeech synthesis requires separate model inference testing.\n' "$URL" "$STAGE" > TELUGU_V2_STATUS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TELUGU_V2_STATUS.md
          git commit -m 'Record validated v2 Space boot'
          git push origin HEAD:child-voice-studio-v01
