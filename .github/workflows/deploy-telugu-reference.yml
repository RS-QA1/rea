name: Deploy Telugu Reference Voice Studio
on:
  push:
    branches: [child-voice-studio-v01]
    paths:
      - "reference_voice_studio/**"
      - ".github/workflows/deploy-telugu-reference.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python files
        run: python -m py_compile reference_voice_studio/app.py reference_voice_studio/deploy.py
      - name: Check Space dependencies resolve on Python 3.11
        run: python -m pip install --dry-run --prefer-binary -r reference_voice_studio/requirements.txt 'gradio[oauth,mcp]==6.31.0' 'uvicorn>=0.14.0' 'websockets>=10.4' spaces
      - name: Install deploy client
        run: python -m pip install "huggingface_hub>=0.29,<2"
      - name: Upload independent reference-voice Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python reference_voice_studio/deploy.py | tee /tmp/reference-deploy.txt
      - name: Record published Space URL
        run: |
          URL="$(sed -n 's/^REFERENCE_SPACE=//p' /tmp/reference-deploy.txt | tail -1)"
          test -n "$URL"
          printf 'Reference Studio Space: %s\\nModel inference not yet verified.\\n' "$URL" > DEPLOYED_REFERENCE_STUDIO.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYED_REFERENCE_STUDIO.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record reference voice Space URL'
            git push origin HEAD:child-voice-studio-v01
          fi
