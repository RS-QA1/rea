name: Validate Telugu voice extraction from video
on:
  push:
    branches: [child-voice-studio-v01]
    paths:
      - ".github/workflows/check-video-reference-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-video:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install video and Gradio test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install "gradio_client==2.7.2"
      - name: Submit an MP4 speech reference and download Telugu WAV
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import wave
          from gradio_client import Client, handle_file
          wav=Path("/tmp/synthetic_reference.wav")
          mp4=Path("/tmp/synthetic_reference.mp4")
          transcript="నమస్కారం. నేను చిన్న కథ చెబుతాను. ఇది నా మాట్లాడే స్వరం."
          subprocess.run(["espeak-ng","-v","te","-s","110","-w",str(wav),transcript],check=True)
          subprocess.run(["ffmpeg","-v","error","-y",
              "-f","lavfi","-i","color=c=black:s=320x240:r=10",
              "-i",str(wav),"-c:v","libx264","-pix_fmt","yuv420p",
              "-c:a","aac","-t","8","-shortest",str(mp4)],check=True)
          assert mp4.stat().st_size>2000
          client=Client("Revankruthi/telugu-video-reference-voice")
          result=client.predict(
              "అమ్మా! నాకు ఒక కథ చెప్పు!",
              handle_file(str(mp4)),None,False,0,8,
              transcript,8,1.0,True,
              api_name="/generate_telugu_reference_voice"
          )
          path=result[0] if isinstance(result,(tuple,list)) else result
          if isinstance(path,dict):path=path.get("path") or path.get("name")
          path=Path(str(path))
          assert path.is_file() and path.stat().st_size>4000
          with wave.open(str(path),"rb") as f:
              duration=f.getnframes()/f.getframerate()
          assert duration>0.5
          print("HOSTED_VIDEO_REFERENCE_PASS",round(duration,2),flush=True)
          PY
