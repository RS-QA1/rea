name: Verify child voice hosted UI
on:
  push:
    branches: [child-voice-studio-v01]
    paths:
      - "child_model_lab/status.py"
      - ".github/workflows/check-child-voice-lab.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "huggingface_hub==0.36.0"
      - name: Check actual Hugging Face child model UI
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python child_model_lab/status.py
